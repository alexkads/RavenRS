[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "27.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexkads/RavenRS"
homepage = "https://alexkads.github.io/RavenRS/"
authors = ["Alex S S Fonseca <alexkads@gmail.com>"]

[workspace.dependencies]
ravenrs = { version = "27.1.0", path = "crates/ravenrs" }
ravenrs-core = { version = "27.1.0", path = "crates/ravenrs-core" }
ravenrs-animation = { version = "27.1.0", path = "crates/ravenrs-animation" }
ravenrs-reactive = { version = "27.1.0", path = "crates/ravenrs-reactive" }
ravenrs-layout = { version = "27.1.0", path = "crates/ravenrs-layout" }
ravenrs-text = { version = "27.1.0", path = "crates/ravenrs-text" }
ravenrs-style = { version = "27.1.0", path = "crates/ravenrs-style" }
ravenrs-render = { version = "27.1.0", path = "crates/ravenrs-render" }
ravenrs-widgets = { version = "27.1.0", path = "crates/ravenrs-widgets" }
ravenrs-platform-native = { version = "27.1.0", path = "crates/ravenrs-platform-native" }
ravenrs-platform-web = { version = "27.1.0", path = "crates/ravenrs-platform-web" }
ravenrs-report = { version = "27.1.0", path = "crates/ravenrs-report" }
ravenrs-criteria = { version = "27.1.0", path = "crates/ravenrs-criteria" }
ravenrs-report-pdf = { version = "27.1.0", path = "crates/ravenrs-report-pdf" }
ravenrs-report-xlsx = { version = "27.1.0", path = "crates/ravenrs-report-xlsx" }
ravenrs-report-server = { version = "27.1.0", path = "crates/ravenrs-report-server" }

wgpu = "30.0.1"
# Without "wayland-csd-adwaita": its font stack (ttf-parser) is unmaintained (RUSTSEC-2026-0192);
# Wayland windows use winit's built-in fallback frame instead.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
accesskit = "0.25.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
accesskit_winit = { version = "0.34.2", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
parley = { version = "0.12.0", default-features = false, features = ["std"] }
swash = "0.2.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned exactly: the `wasm-bindgen` CLI used to post-process the .wasm must match.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.80"
web-sys = "0.3.107"
console_error_panic_hook = "0.1.7"
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Only for the ravenrs-mcp tool; nothing in the framework depends on these.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54", default-features = false, features = ["macros", "rt"] }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Smaller WASM binaries; native release builds benefit as well.
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
