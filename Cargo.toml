[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexkads/RavenRS"

[workspace.dependencies]
raven = { path = "crates/raven" }
raven-core = { path = "crates/raven-core" }
raven-reactive = { path = "crates/raven-reactive" }
raven-layout = { path = "crates/raven-layout" }
raven-text = { path = "crates/raven-text" }
raven-style = { path = "crates/raven-style" }
raven-render = { path = "crates/raven-render" }
raven-widgets = { path = "crates/raven-widgets" }
raven-platform-native = { path = "crates/raven-platform-native" }
raven-platform-web = { path = "crates/raven-platform-web" }

wgpu = "30.0.1"
winit = "0.30.13"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
parley = { version = "0.12.0", default-features = false, features = ["std"] }
swash = "0.2.10"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned exactly: the `wasm-bindgen` CLI used to post-process the .wasm must match.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.80"
web-sys = "0.3.107"
console_error_panic_hook = "0.1.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Smaller WASM binaries; native release builds benefit as well.
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
