name: Pages

# Builds the landing page plus the WebAssembly demo and publishes them to the
# gh-pages branch, which GitHub Pages serves at https://alexkads.github.io/RavenRS/.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: ./scripts/build-web.sh hello-world
      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp site/index.html _site/
          cp -R examples/hello-world/web/. _site/demo/
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
