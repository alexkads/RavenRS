<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Wireframe: Novo projeto por intenção">
<title>Wireframe: Novo projeto por intenção</title><style>
:root{--bg:#ffffff;--panel:#f5f6f8;--line:#d4d7dd;--ink:#1d2025;--muted:#5f6673;--accent:#3b5bdb;--ok:#2b8a3e;--warn:#b35c00;--bad:#c92a2a;--chip:#e9ecf2}
@media (prefers-color-scheme: dark){:root{--bg:#16181c;--panel:#1f2228;--line:#3a3f48;--ink:#e8eaee;--muted:#a3aab6;--accent:#8ea2ff;--ok:#69db7c;--warn:#ffa94d;--bad:#ff8787;--chip:#2a2e36}}
.bg{fill:var(--bg)} .p{fill:var(--panel);stroke:var(--line)} .l{stroke:var(--line);fill:none}
.t{fill:var(--ink);font:13px system-ui,sans-serif} .s{fill:var(--muted);font:11px system-ui,sans-serif}
.h{fill:var(--ink);font:600 15px system-ui,sans-serif} .m{fill:var(--ink);font:11px ui-monospace,monospace}
.chip{fill:var(--chip);stroke:var(--line)} .acc{fill:var(--accent)} .acct{fill:var(--accent);font:600 12px system-ui,sans-serif}
.ok{fill:var(--ok);font:600 11px system-ui,sans-serif} .warn{fill:var(--warn);font:600 11px system-ui,sans-serif}
.bad{fill:var(--bad);font:600 11px system-ui,sans-serif} .btn{fill:var(--accent)} .btnt{fill:#fff;font:600 12px system-ui,sans-serif}
.edge{stroke:var(--accent);stroke-width:1.6;fill:none} .edgew{stroke:var(--warn);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.n{fill:var(--accent);font:600 11px system-ui,sans-serif}
</style>
<rect class="bg" width="1200" height="720"/>
<rect class="p" x="0" y="0" width="1200" height="40" rx="0"/>
<text class="h" x="16" y="25" text-anchor="start">Raven Data Studio</text>
<text class="s" x="190" y="25" text-anchor="start">Projetos › Novo projeto</text>
<rect class="p" x="200" y="70" width="800" height="96" rx="6"/>
<text class="s" x="220" y="98" text-anchor="start">Você</text>
<text class="t" x="220" y="120" text-anchor="start">Importe clientes e pedidos do sistema antigo. Separe os endereços, identifique</text>
<text class="t" x="220" y="140" text-anchor="start">duplicidades por CPF, preserve os vínculos dos pedidos e crie as tabelas necessárias.</text>
<rect class="p" x="200" y="184" width="800" height="400" rx="6"/>
<text class="s" x="220" y="210" text-anchor="start">Assistente · proposta v1</text>
<circle cx="990" cy="200" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="990" y="204" text-anchor="middle">1</text>
<rect class="chip" x="220" y="224" width="86.0" height="17" rx="8"/>
<text class="acct" x="227" y="236" text-anchor="start">✦ Sugestão</text>
<text class="t" x="330" y="236" text-anchor="start">Entendi assim:</text>
<text class="s" x="220" y="268" text-anchor="start">Origem</text>
<text class="t" x="330" y="268" text-anchor="start">legado: CLIENTES (1.248) · PEDIDOS (5.312)</text>
<text class="s" x="220" y="292" text-anchor="start">Destino</text>
<text class="t" x="330" y="292" text-anchor="start">loja: customers (existe) · customer_addresses, orders (criar)</text>
<text class="s" x="220" y="316" text-anchor="start">Vínculo</text>
<text class="t" x="330" y="316" text-anchor="start">PEDIDOS.COD_CLI → CLIENTES.COD_CLI (inferido, 99,7%)</text>
<text class="s" x="220" y="340" text-anchor="start">Duplicidade</text>
<text class="t" x="330" y="340" text-anchor="start">CPF normalizado: 37 grupos</text>
<text class="t" x="220" y="380" text-anchor="start">Preciso que você decida:</text>
<circle cx="990" cy="372" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="990" y="376" text-anchor="middle">2</text>
<text class="warn" x="232" y="404" text-anchor="start">⚠ Qual cliente sobrevive na mescla por CPF?</text>
<text class="warn" x="232" y="426" text-anchor="start">⚠ O que fazer com SITUACAO = X (6 pedidos)?</text>
<text class="s" x="232" y="448" text-anchor="start">ⓘ 23 endereços sem divisão segura irão para revisão</text>
<rect class="btn" x="220" y="520" width="132" height="26" rx="6"/>
<text class="btnt" x="286.0" y="537" text-anchor="middle">Aceitar proposta</text>
<rect class="chip" x="362" y="520" width="104" height="26" rx="6"/>
<text class="t" x="414.0" y="537" text-anchor="middle">Ver detalhes</text>
<rect class="chip" x="476" y="520" width="69" height="26" rx="6"/>
<text class="t" x="510.5" y="537" text-anchor="middle">Recusar</text>
<circle cx="990" cy="532" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="990" y="536" text-anchor="middle">3</text>
<rect class="p" x="200" y="604" width="700" height="40" rx="6"/>
<text class="s" x="216" y="629" text-anchor="start">Peça um ajuste… (ex.: separe também o telefone)</text>
<rect class="btn" x="912" y="611" width="62" height="26" rx="6"/>
<text class="btnt" x="943.0" y="628" text-anchor="middle">Enviar</text>
<rect class="chip" x="1010" y="611" width="55" height="26" rx="6"/>
<text class="t" x="1037.5" y="628" text-anchor="middle">Parar</text>
<rect class="chip" x="200" y="654" width="400" height="30" rx="6"/>
<text class="s" x="212" y="674" text-anchor="start">📎 clientes.csv · 212 KB   ✕</text>
<text class="s" x="1030" y="98" text-anchor="start">1 Card de proposta</text>
<text class="s" x="1030" y="116" text-anchor="start">(ChatMessage::card)</text>
<text class="s" x="1030" y="380" text-anchor="start">2 Pendências viram</text>
<text class="s" x="1030" y="398" text-anchor="start">PendingDecision</text>
<text class="s" x="1030" y="540" text-anchor="start">3 Nada é criado sem</text>
<text class="s" x="1030" y="558" text-anchor="start">aceitar</text>
</svg>