<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1320" width="1280" height="1320" role="img" aria-label="Wireframe: Interações passo a passo">
<title>Wireframe: Interações passo a passo</title><style>
:root{--bg:#ffffff;--panel:#f5f6f8;--line:#d4d7dd;--ink:#1d2025;--muted:#5f6673;--accent:#3b5bdb;--ok:#2b8a3e;--warn:#b35c00;--bad:#c92a2a;--chip:#e9ecf2}
@media (prefers-color-scheme: dark){:root{--bg:#16181c;--panel:#1f2228;--line:#3a3f48;--ink:#e8eaee;--muted:#a3aab6;--accent:#8ea2ff;--ok:#69db7c;--warn:#ffa94d;--bad:#ff8787;--chip:#2a2e36}}
.bg{fill:var(--bg)} .p{fill:var(--panel);stroke:var(--line)} .l{stroke:var(--line);fill:none}
.t{fill:var(--ink);font:13px system-ui,sans-serif} .s{fill:var(--muted);font:11px system-ui,sans-serif}
.h{fill:var(--ink);font:600 15px system-ui,sans-serif} .m{fill:var(--ink);font:11px ui-monospace,monospace}
.chip{fill:var(--chip);stroke:var(--line)} .acc{fill:var(--accent)} .acct{fill:var(--accent);font:600 12px system-ui,sans-serif}
.ok{fill:var(--ok);font:600 11px system-ui,sans-serif} .warn{fill:var(--warn);font:600 11px system-ui,sans-serif}
.bad{fill:var(--bad);font:600 11px system-ui,sans-serif} .btn{fill:var(--accent)} .btnt{fill:#fff;font:600 12px system-ui,sans-serif}
.edge{stroke:var(--accent);stroke-width:1.6;fill:none} .edgew{stroke:var(--warn);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.n{fill:var(--accent);font:600 11px system-ui,sans-serif}
</style>
<rect class="bg" width="1280" height="1320"/>
<text class="h" x="24" y="36" text-anchor="start">Interações do Raven Data Studio</text>
<text class="s" x="24" y="58" text-anchor="start">Cada gesto em quatro passos, com ponteiro, teclado, leitor de tela e histórico.</text>
<text class="h" x="24" y="98" text-anchor="start">I1 · Ligar campo no canvas</text>
<rect class="p" x="24" y="108" width="236" height="84" rx="6"/>
<circle cx="40" cy="126" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="40" y="130" text-anchor="middle">1</text>
<text class="t" x="36" y="154" text-anchor="start">Aponta a porta de </text>
<text class="t" x="36" y="172" text-anchor="start">CLIENTES.CPF </text>
<rect class="p" x="274" y="108" width="236" height="84" rx="6"/>
<circle cx="290" cy="126" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="290" y="130" text-anchor="middle">2</text>
<text class="t" x="286" y="154" text-anchor="start">Arrasta: portas compatíveis </text>
<text class="t" x="286" y="172" text-anchor="start">acendem </text>
<rect class="p" x="524" y="108" width="236" height="84" rx="6"/>
<circle cx="540" cy="126" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="540" y="130" text-anchor="middle">3</text>
<text class="t" x="536" y="154" text-anchor="start">Solta em customers.document </text>
<rect class="p" x="774" y="108" width="236" height="84" rx="6"/>
<circle cx="790" cy="126" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="790" y="130" text-anchor="middle">4</text>
<text class="t" x="786" y="154" text-anchor="start">Ligação criada; sugestão de </text>
<text class="t" x="786" y="172" text-anchor="start">regra </text>
<text class="s" x="24" y="214" text-anchor="start">Ponteiro: arrastar de porta a porta</text>
<text class="s" x="544" y="214" text-anchor="start">Teclado: Enter no campo, setas escolhem, Enter confirma, Esc cancela</text>
<text class="s" x="24" y="232" text-anchor="start">Leitor: “CPF para document; regra Só dígitos sugerida”</text>
<text class="s" x="544" y="232" text-anchor="start">Histórico: 1 PlanPatch (SetFieldMapping)</text>
<text class="h" x="24" y="278" text-anchor="start">I2 · Recusa de ligação</text>
<rect class="p" x="24" y="288" width="236" height="84" rx="6"/>
<circle cx="40" cy="306" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="40" y="310" text-anchor="middle">1</text>
<text class="t" x="36" y="334" text-anchor="start">Arrasta DATA (texto) </text>
<rect class="p" x="274" y="288" width="236" height="84" rx="6"/>
<circle cx="290" cy="306" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="290" y="310" text-anchor="middle">2</text>
<text class="t" x="286" y="334" text-anchor="start">Paira sobre customers.phone </text>
<rect class="p" x="524" y="288" width="236" height="84" rx="6"/>
<circle cx="540" cy="306" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="540" y="310" text-anchor="middle">3</text>
<text class="t" x="536" y="334" text-anchor="start">Porta fica vermelha + </text>
<text class="t" x="536" y="352" text-anchor="start">motivo </text>
<rect class="p" x="774" y="288" width="236" height="84" rx="6"/>
<circle cx="790" cy="306" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="790" y="310" text-anchor="middle">4</text>
<text class="t" x="786" y="334" text-anchor="start">Solta: nada muda </text>
<text class="s" x="24" y="394" text-anchor="start">Ponteiro: motivo junto ao cursor</text>
<text class="s" x="544" y="394" text-anchor="start">Teclado: destino incompatível não entra na lista</text>
<text class="s" x="24" y="412" text-anchor="start">Leitor: “Não aceito: texto de data não vira telefone”</text>
<text class="s" x="544" y="412" text-anchor="start">Histórico: nada</text>
<text class="h" x="24" y="458" text-anchor="start">I3 · Aceitar sugestão da IA</text>
<rect class="p" x="24" y="468" width="236" height="84" rx="6"/>
<circle cx="40" cy="486" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="40" y="490" text-anchor="middle">1</text>
<text class="t" x="36" y="514" text-anchor="start">Card de proposta com 5 </text>
<text class="t" x="36" y="532" text-anchor="start">operações </text>
<rect class="p" x="274" y="468" width="236" height="84" rx="6"/>
<circle cx="290" cy="486" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="290" y="490" text-anchor="middle">2</text>
<text class="t" x="286" y="514" text-anchor="start">Abre detalhes de uma </text>
<rect class="p" x="524" y="468" width="236" height="84" rx="6"/>
<circle cx="540" cy="486" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="540" y="490" text-anchor="middle">3</text>
<text class="t" x="536" y="514" text-anchor="start">Aceita 4, recusa 1 </text>
<rect class="p" x="774" y="468" width="236" height="84" rx="6"/>
<circle cx="790" cy="486" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="790" y="490" text-anchor="middle">4</text>
<text class="t" x="786" y="514" text-anchor="start">Versão n+1; simulação </text>
<text class="t" x="786" y="532" text-anchor="start">desatualizada </text>
<text class="s" x="24" y="574" text-anchor="start">Ponteiro: Aceitar/Recusar por item</text>
<text class="s" x="544" y="574" text-anchor="start">Teclado: Tab entre itens, Espaço marca, Enter aplica</text>
<text class="s" x="24" y="592" text-anchor="start">Leitor: “4 aceitas, 1 recusada; plano versão 8”</text>
<text class="s" x="544" y="592" text-anchor="start">Histórico: 1 PlanPatch com 4 ops</text>
<text class="h" x="24" y="638" text-anchor="start">I4 · Testar regra (antes → depois)</text>
<rect class="p" x="24" y="648" width="236" height="84" rx="6"/>
<circle cx="40" cy="666" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="40" y="670" text-anchor="middle">1</text>
<text class="t" x="36" y="694" text-anchor="start">Seleciona orders.total </text>
<rect class="p" x="274" y="648" width="236" height="84" rx="6"/>
<circle cx="290" cy="666" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="290" y="670" text-anchor="middle">2</text>
<text class="t" x="286" y="694" text-anchor="start">Edita ParseDecimal </text>
<rect class="p" x="524" y="648" width="236" height="84" rx="6"/>
<circle cx="540" cy="666" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="540" y="670" text-anchor="middle">3</text>
<text class="t" x="536" y="694" text-anchor="start">Grade mostra antes → depois </text>
<rect class="p" x="774" y="648" width="236" height="84" rx="6"/>
<circle cx="790" cy="666" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="790" y="670" text-anchor="middle">4</text>
<text class="t" x="786" y="694" text-anchor="start">0 erros em 200 </text>
<text class="s" x="24" y="754" text-anchor="start">Ponteiro: editar no inspetor</text>
<text class="s" x="544" y="754" text-anchor="start">Teclado: F2 edita, Cmd/Ctrl+Enter testa</text>
<text class="s" x="24" y="772" text-anchor="start">Leitor: “200 afetados, 0 erros”</text>
<text class="s" x="544" y="772" text-anchor="start">Histórico: 1 PlanPatch ao confirmar</text>
<text class="h" x="24" y="818" text-anchor="start">I5 · Desfazer</text>
<rect class="p" x="24" y="828" width="236" height="84" rx="6"/>
<circle cx="40" cy="846" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="40" y="850" text-anchor="middle">1</text>
<text class="t" x="36" y="874" text-anchor="start">Mudou total para </text>
<text class="t" x="36" y="892" text-anchor="start">NUMERIC(10,2) </text>
<rect class="p" x="274" y="828" width="236" height="84" rx="6"/>
<circle cx="290" cy="846" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="290" y="850" text-anchor="middle">2</text>
<text class="t" x="286" y="874" text-anchor="start">Simulação marcada </text>
<text class="t" x="286" y="892" text-anchor="start">desatualizada </text>
<rect class="p" x="524" y="828" width="236" height="84" rx="6"/>
<circle cx="540" cy="846" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="540" y="850" text-anchor="middle">3</text>
<text class="t" x="536" y="874" text-anchor="start">Cmd/Ctrl+Z </text>
<rect class="p" x="774" y="828" width="236" height="84" rx="6"/>
<circle cx="790" cy="846" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="790" y="850" text-anchor="middle">4</text>
<text class="t" x="786" y="874" text-anchor="start">Plano volta à v7; simulação </text>
<text class="t" x="786" y="892" text-anchor="start">v7 válida de novo </text>
<text class="s" x="24" y="934" text-anchor="start">Ponteiro: menu Editar › Desfazer</text>
<text class="s" x="544" y="934" text-anchor="start">Teclado: Cmd/Ctrl+Z, Shift+Cmd/Ctrl+Z</text>
<text class="s" x="24" y="952" text-anchor="start">Leitor: “Desfeito: tipo de total”</text>
<text class="s" x="544" y="952" text-anchor="start">Histórico: pilha de patches da sessão</text>
<text class="h" x="24" y="998" text-anchor="start">I6 · Cancelar execução</text>
<rect class="p" x="24" y="1008" width="236" height="84" rx="6"/>
<circle cx="40" cy="1026" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="40" y="1030" text-anchor="middle">1</text>
<text class="t" x="36" y="1054" text-anchor="start">Executando lote 3 de orders </text>
<rect class="p" x="274" y="1008" width="236" height="84" rx="6"/>
<circle cx="290" cy="1026" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="290" y="1030" text-anchor="middle">2</text>
<text class="t" x="286" y="1054" text-anchor="start">Cancelar… </text>
<rect class="p" x="524" y="1008" width="236" height="84" rx="6"/>
<circle cx="540" cy="1026" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="540" y="1030" text-anchor="middle">3</text>
<text class="t" x="536" y="1054" text-anchor="start">Confirma: “termina o lote </text>
<text class="t" x="536" y="1072" text-anchor="start">atual” </text>
<rect class="p" x="774" y="1008" width="236" height="84" rx="6"/>
<circle cx="790" cy="1026" r="9" fill="none" stroke="var(--accent)"/>
<text class="n" x="790" y="1030" text-anchor="middle">4</text>
<text class="t" x="786" y="1054" text-anchor="start">Cancelado; lotes 1–3 </text>
<text class="t" x="786" y="1072" text-anchor="start">gravados </text>
<text class="s" x="24" y="1114" text-anchor="start">Ponteiro: botão + ConfirmDialog</text>
<text class="s" x="544" y="1114" text-anchor="start">Teclado: Esc não cancela execução; só o botão</text>
<text class="s" x="24" y="1132" text-anchor="start">Leitor: assertivo “Execução cancelada”</text>
<text class="s" x="544" y="1132" text-anchor="start">Histórico: evento de auditoria</text>
<text class="h" x="24" y="1170" text-anchor="start">Janela estreita (&lt; 900 px)</text>
<rect class="p" x="24" y="1184" width="200" height="110" rx="6"/>
<text class="t" x="36" y="1206" text-anchor="start">☰  Mapeamento</text>
<text class="s" x="36" y="1230" text-anchor="start">Grade (canvas oculto)</text>
<text class="s" x="36" y="1252" text-anchor="start">Inspetor → Sheet</text>
<text class="s" x="36" y="1274" text-anchor="start">Conversa → Sheet</text>
<text class="h" x="260" y="1170" text-anchor="start">Mapa de teclado</text>
<text class="m" x="260" y="1200" text-anchor="start">Cmd/Ctrl+K</text>
<text class="t" x="380" y="1200" text-anchor="start">Paleta de comandos</text>
<text class="m" x="680" y="1200" text-anchor="start">F6</text>
<text class="t" x="800" y="1200" text-anchor="start">Próxima região</text>
<text class="m" x="260" y="1222" text-anchor="start">Cmd/Ctrl+Z</text>
<text class="t" x="380" y="1222" text-anchor="start">Desfazer patch</text>
<text class="m" x="680" y="1222" text-anchor="start">Cmd/Ctrl+Enter</text>
<text class="t" x="800" y="1222" text-anchor="start">Ação principal</text>
<text class="m" x="260" y="1244" text-anchor="start">F8</text>
<text class="t" x="380" y="1244" text-anchor="start">Próximo problema</text>
<text class="m" x="680" y="1244" text-anchor="start">F7</text>
<text class="t" x="800" y="1244" text-anchor="start">Próximo trecho da diferença</text>
<text class="m" x="260" y="1266" text-anchor="start">+ − 0</text>
<text class="t" x="380" y="1266" text-anchor="start">Zoom do canvas</text>
<text class="m" x="680" y="1266" text-anchor="start">Shift+F10</text>
<text class="t" x="800" y="1266" text-anchor="start">Menu de contexto (E-5)</text>
</svg>