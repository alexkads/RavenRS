[package]
name = "ravenrs-app"
description = "The model of a RavenRS business application: entities, a layered application model, object spaces, actions and controllers. No GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-app"
keywords = ["application", "framework", "model", "crud"]
categories = ["gui", "data-structures"]

[dependencies]
ravenrs-app-i18n.workspace = true
argon2.workspace = true
ravenrs-app-derive.workspace = true
ravenrs-core.workspace = true
ravenrs-criteria.workspace = true
ravenrs-reactive.workspace = true
regex-lite.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }

[dev-dependencies]
proptest.workspace = true
trybuild.workspace = true

[lints]
workspace = true
