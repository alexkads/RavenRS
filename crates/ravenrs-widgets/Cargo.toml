[package]
name = "ravenrs-widgets"
description = "RavenRS declarative views, the extension API for custom components, and the UI runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-widgets"
keywords = ["gui", "ui", "widgets", "components", "datagrid"]
categories = ["gui"]

[dependencies]
ravenrs-widgets-base.workspace = true
ravenrs-widgets-kit.workspace = true
ravenrs-widgets-chat.workspace = true
ravenrs-widgets-charts.workspace = true
ravenrs-widgets-imaging.workspace = true
ravenrs-widgets-dock.workspace = true
ravenrs-widgets-scheduler.workspace = true
ravenrs-widgets-lists.workspace = true
ravenrs-widgets-grid.workspace = true
ravenrs-core.workspace = true
ravenrs-reactive.workspace = true
ravenrs-layout.workspace = true
ravenrs-live = { workspace = true, optional = true }
ravenrs-style.workspace = true
ravenrs-graphics = { workspace = true, optional = true }
ravenrs-lottie = { workspace = true, optional = true }

[features]
default = ["decode", "charts", "flow", "lottie"]
# PNG and JPEG decoding for `Image::from_bytes`.
decode = ["ravenrs-widgets-base/decode", "ravenrs-widgets-kit/decode"]
# `Chart`, `BarChart`, `AreaChart` and `Barcode`, drawn with `ravenrs-graphics`.
charts = ["dep:ravenrs-graphics", "ravenrs-widgets-charts/charts"]
# `FlowCanvas`, diagrams of nodes and connections laid out with `ravenrs-graphics`.
flow = ["dep:ravenrs-graphics", "ravenrs-widgets-charts/flow"]
# `Lottie`, a player of Lottie animations of our own.
lottie = ["dep:ravenrs-lottie", "ravenrs-widgets-imaging/lottie"]
# `CodeEditor` and `Playground`, with Fira Mono embedded in `ravenrs-text`.
code = ["ravenrs-widgets-chat/code"]
# `LiveRunner`: the Playground runs edited examples with the interpreter of ravenrs-live.
live = ["code", "dep:ravenrs-live", "ravenrs-widgets-base/live", "ravenrs-widgets-kit/live", "ravenrs-core/live", "ravenrs-style/live", "ravenrs-layout/live", "ravenrs-graphics?/live", "ravenrs-lottie?/live", "ravenrs-widgets-grid/live", "ravenrs-widgets-lists/live", "ravenrs-widgets-scheduler/live", "ravenrs-widgets-dock/live", "ravenrs-widgets-imaging/live", "ravenrs-widgets-charts/live", "ravenrs-widgets-chat/live"]

[dev-dependencies]
ravenrs-animation.workspace = true
ravenrs-criteria.workspace = true
serde_json.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "grid_query"
harness = false

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
