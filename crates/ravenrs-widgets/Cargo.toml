[package]
name = "ravenrs-widgets"
description = "RavenRS declarative views, the extension API for custom components, and the UI runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-widgets"
keywords = ["gui", "ui", "widgets", "components", "datagrid"]
categories = ["gui"]

# The modules of this crate use each other in a loop of 41; `module_cycle` holds it there so it
# cannot grow, and asks for a lower number as #293 untangles it. `cargo ravenrs-lint -p ravenrs-widgets --modules`
# shows who uses whom.
[package.metadata.ravenrs-lint]
max-module-cycle = 41

[dependencies]
ravenrs-app-i18n.workspace = true
ravenrs-core.workspace = true
ravenrs-animation.workspace = true
ravenrs-reactive.workspace = true
ravenrs-layout.workspace = true
ravenrs-text.workspace = true
ravenrs-live = { workspace = true, optional = true }
ravenrs-style.workspace = true
ravenrs-criteria.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { workspace = true, optional = true }
ravenrs-graphics = { workspace = true, optional = true }
ravenrs-lottie = { workspace = true, optional = true }

[features]
default = ["decode", "charts", "flow", "lottie"]
# PNG and JPEG decoding for `Image::from_bytes`.
decode = ["dep:image"]
# `Chart`, `BarChart`, `AreaChart` and `Barcode`, drawn with `ravenrs-graphics`.
charts = ["dep:ravenrs-graphics"]
# `FlowCanvas`, diagrams of nodes and connections laid out with `ravenrs-graphics`.
flow = ["dep:ravenrs-graphics"]
# `Lottie`, a player of Lottie animations of our own.
lottie = ["dep:ravenrs-lottie"]
# `CodeEditor` and `Playground`, with Fira Mono embedded in `ravenrs-text`.
code = ["ravenrs-text/mono"]
# `LiveRunner`: the Playground runs edited examples with the interpreter of ravenrs-live.
live = [
    "code",
    "dep:ravenrs-live",
    "ravenrs-core/live",
    "ravenrs-style/live",
    "ravenrs-layout/live",
    "ravenrs-graphics?/live",
    "ravenrs-lottie?/live",
]

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "grid_query"
harness = false

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
