[package]
name = "ravenrs-app-update"
workspace = "../../camadas/telas"
description = "Installing, updating and versioning a RavenRS app by compiling it on the user's machine: one installer for Windows, macOS and Linux, the news of each version, and the check that keeps the release files together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-app-update"
keywords = ["application", "update", "installer", "release-notes"]
categories = ["development-tools::build-utils"]
# The installer's template is read by `render_installer`.
include = ["src/**/*", "tests/**/*", "install.cmd.in", "README.md"]

[dependencies]
ravenrs-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# The news and the notice drawn the same way in every app (feature `ui`).
ravenrs-layout = { workspace = true, optional = true }
ravenrs-reactive = { workspace = true, optional = true }
ravenrs-style = { workspace = true, optional = true }
ravenrs-widgets = { workspace = true, optional = true }

# Downloading the news and the installer is for the desktop: in the browser the app is the page,
# with nothing to install, and `ureq` pulls `ring`, which does not build for wasm32 (#813).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[features]
# The news dialog, the version button and the notice in the status bar, with RavenRS widgets.
ui = ["dep:ravenrs-layout", "dep:ravenrs-reactive", "dep:ravenrs-style", "dep:ravenrs-widgets"]

[dev-dependencies]
ravenrs-e2e.workspace = true

[lints]
workspace = true
