[package]
name = "ravenrs-agent-cli"
description = "Flow nodes that call the coding agents installed on the computer (the Codex CLI and the Claude CLI): reading only by default, limits checked against what the installed CLI keeps, their JSON events read, secrets taken out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-agent-cli"
keywords = ["agents", "codex", "claude", "workflow", "automation"]
categories = ["development-tools"]

[dependencies]
ravenrs-flows.workspace = true
ravenrs-process.workspace = true
serde.workspace = true
serde_json.workspace = true

# The CLI the tests run, which spends no subscription.
[[bin]]
name = "ravenrs-agent-cli-fake"
path = "fake/main.rs"
test = false
doc = false

[lints]
workspace = true
