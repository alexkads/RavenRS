[package]
name = "ravenrs"
description = "RavenRS: beautiful native interfaces, powered by Rust. One declarative UI for desktop and WebAssembly, drawn on the GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ravenrs"
keywords = ["gui", "ui", "wgpu", "webgpu", "wasm"]
categories = ["gui", "graphics", "wasm"]
readme = "README.md"

[features]
default = ["decode", "charts", "flow", "lottie"]
# PNG and JPEG decoding for `Image::from_bytes`.
decode = ["ravenrs-widgets/decode"]
# `Chart`, `BarChart`, `AreaChart` and `Barcode`.
charts = ["ravenrs-widgets/charts"]
# `FlowCanvas`: diagrams of nodes joined by connections.
flow = ["ravenrs-widgets/flow"]
# `Lottie`, a player of Lottie animations of our own.
lottie = ["ravenrs-widgets/lottie"]
# `CodeEditor` and `Playground`, with a monospaced font embedded.
code = ["ravenrs-widgets/code"]
# `LiveRunner`, which runs edited examples in a `Playground` without a compiler.
live = ["ravenrs-widgets/live", "dep:ravenrs-live", "ravenrs-movie/live"]
# The icon beside the clock of `AppIdentity::close_to_tray`, on the desktop.
tray = ["ravenrs-platform-native/tray"]
# The system's notifications of `SystemNotifier`, on the desktop.
notifications = ["ravenrs-platform-native/notifications"]

[dependencies]
ravenrs-core.workspace = true
ravenrs-animation.workspace = true
ravenrs-reactive.workspace = true
ravenrs-layout.workspace = true
ravenrs-text.workspace = true
ravenrs-style.workspace = true
ravenrs-render.workspace = true
ravenrs-widgets.workspace = true
ravenrs-live = { workspace = true, optional = true }
ravenrs-movie.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ravenrs-platform-native.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ravenrs-platform-web.workspace = true

[dev-dependencies]
ravenrs-lottie.workspace = true
pollster.workspace = true
image = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Linux pulls in zbus, which nightly 2026-10-31 (the compiler docs.rs uses) cannot
# compile; stable can. The API is the same on every desktop platform.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
