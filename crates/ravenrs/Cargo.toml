[package]
name = "ravenrs"
description = "RavenRS: beautiful native interfaces, powered by Rust. One declarative UI for desktop and WebAssembly, drawn on the GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ravenrs"
keywords = ["gui", "ui", "wgpu", "webgpu", "wasm"]
categories = ["gui", "graphics", "wasm"]
readme = "README.md"

[features]
default = ["decode", "charts"]
# PNG and JPEG decoding for `Image::from_bytes`.
decode = ["ravenrs-widgets/decode"]
# `Chart`, `BarChart`, `AreaChart` and `Barcode`.
charts = ["ravenrs-widgets/charts"]

[dependencies]
ravenrs-core.workspace = true
ravenrs-animation.workspace = true
ravenrs-reactive.workspace = true
ravenrs-layout.workspace = true
ravenrs-text.workspace = true
ravenrs-style.workspace = true
ravenrs-render.workspace = true
ravenrs-widgets.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ravenrs-platform-native.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ravenrs-platform-web.workspace = true

[dev-dependencies]
pollster.workspace = true
image = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Linux pulls in zbus, which nightly 2026-10-31 (the compiler docs.rs uses) cannot
# compile; stable can. The API is the same on every desktop platform.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
