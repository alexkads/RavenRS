[package]
name = "ravenrs-platform-native"
description = "RavenRS desktop backend: winit windows rendered with wgpu on Windows, macOS and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-platform-native"
keywords = ["gui", "winit", "wgpu", "desktop"]
categories = ["gui"]

[dependencies]
ravenrs-core.workspace = true
ravenrs-style.workspace = true
ravenrs-widgets.workspace = true
ravenrs-render.workspace = true
winit.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
arboard.workspace = true
pollster.workspace = true
tracing.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
# Linux pulls in zbus, which nightly 2026-10-31 (the compiler docs.rs uses) cannot
# compile; stable can. The API is the same on every desktop platform.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
