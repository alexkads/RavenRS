[package]
name = "ravenrs-app-postgres"
description = "PostgreSQL for RavenRS applications: records on tables, as an ObjectSpace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-app-postgres"
keywords = ["postgres", "database", "business", "orm"]
categories = ["database"]

[dependencies]
ravenrs-app.workspace = true
ravenrs-app-sql.workspace = true
ravenrs-criteria.workspace = true
postgres = "0.19.9"
bytes = "1"
# TLS for databases that require it (Supabase, Neon): rustls with ring, as the rest of the
# workspace already uses, so nothing links OpenSSL and it builds the same on every system.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"

[dev-dependencies]
# Path only: dev-dependencies without a version are left out when the crate is published.
ravenrs-app-testkit = { path = "../ravenrs-app-testkit" }
ravenrs-app-server.workspace = true
serde_json.workspace = true

[lints]
workspace = true
