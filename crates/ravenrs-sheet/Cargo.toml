[package]
name = "ravenrs-sheet"
description = "Headless spreadsheet engine for RavenRS: cells, styles, formulas with 500+ functions, recalculation, number formats, XLSX/XLS/CSV reading and writing and password-protected workbooks."
version.workspace = true
edition.workspace = true
# The engine came from GridCraft, which needs a newer compiler than the rest of the workspace.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-sheet"
keywords = ["spreadsheet", "xlsx", "excel", "formula", "wasm"]
categories = ["parser-implementations", "encoding", "mathematics"]

[dependencies]
image.workspace = true
aes = { version = "0.9", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
log = "0.4"
quick-xml = "0.41"
ratex-font = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-types = "=0.1.14"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
web-time = "1.1.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# For the modules from craft-libs (see NOTICE): encrypted workbooks, compound files, .xls.
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
hmac = "0.13"
md5 = { package = "md-5", version = "0.11", default-features = false }
miniz_oxide = "0.9"
zeroize = "1"

[features]
# Builds password-encrypted workbooks in code for tests elsewhere; never enabled in a shipped build.
test-support = []

# A test of craft-libs' ZIP reader that uses its sample of a ZIP64 entry count, built only with
# test-support (as craft-libs builds it for its own tests).
[[test]]
name = "craft_zip_archive"
required-features = ["test-support"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

[dev-dependencies]
serde_json.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"
