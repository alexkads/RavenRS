[package]
name = "ravenrs-report-designer"
description = "The RavenRS report designer, to put inside an application: bands, fields, properties and a live preview."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-report-designer"
keywords = ["report", "designer", "gui"]
categories = ["gui"]

[dependencies]
ravenrs-core.workspace = true
ravenrs-layout.workspace = true
ravenrs-reactive.workspace = true
ravenrs-report.workspace = true
ravenrs-report-export.workspace = true
ravenrs-report-label.workspace = true
ravenrs-report-viewer.workspace = true
ravenrs-style.workspace = true
ravenrs-widgets = { workspace = true, features = ["charts"] }
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ravenrs-platform-native.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Performance", "Document", "Element", "HtmlElement", "HtmlIFrameElement", "Node", "CssStyleDeclaration", "FontFaceSet", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "FileReader"] }

[lints]
workspace = true
