[package]
name = "ravenrs-movie"
description = "Training videos of a RavenRS app: small vector films recorded from a script, edited on a timeline and played as an interactive manual."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-movie"
keywords = ["video", "manual", "gui", "wasm"]
categories = ["gui", "multimedia::video"]

[features]
# The stories of its components, for RavenComponentBook (`book::stories`).
book = ["ravenrs-widgets/book"]
# Registers its types with the playground's interpreter.
live = ["dep:ravenrs-live", "ravenrs-widgets/live"]

[dependencies]
ravenrs-live = { workspace = true, optional = true }
ravenrs-app-i18n.workspace = true
ravenrs-core.workspace = true
# Films an end-to-end session (SessionFilm, Recorder), and an app's session over the test channel.
ravenrs-e2e.workspace = true
ravenrs-e2e-wire.workspace = true
ravenrs-layout.workspace = true
ravenrs-reactive.workspace = true
ravenrs-style.workspace = true
ravenrs-text.workspace = true
ravenrs-widgets = { workspace = true, features = ["lottie"] }
flate2 = "1.1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
