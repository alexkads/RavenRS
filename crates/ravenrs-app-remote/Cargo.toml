[package]
name = "ravenrs-app-remote"
description = "A RavenRS application over the web API of ravenrs-app-server, on the desktop and in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-app-remote"
keywords = ["rest", "client", "gui", "business", "wasm"]
categories = ["gui", "web-programming::http-client"]

[dependencies]
ravenrs-app.workspace = true
ravenrs-app-i18n.workspace = true
ravenrs-app-ui.workspace = true
ravenrs-layout.workspace = true
ravenrs-reactive.workspace = true
ravenrs-style.workspace = true
ravenrs-widgets.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Headers", "Request", "RequestInit", "Response", "Window"] }

[dev-dependencies]
ravenrs-app-server.workspace = true
ravenrs-core.workspace = true
ravenrs-criteria.workspace = true

[lints]
workspace = true
