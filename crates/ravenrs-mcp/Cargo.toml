[package]
name = "ravenrs-mcp"
description = "An MCP server without side effects that answers questions about RavenRS (components, their API and examples, design tokens, parity status and expressions) and creates and checks report layouts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Embeds sources and docs from the rest of the workspace at build time, which a
# package on crates.io could not reach. Install it from git or from a checkout.
publish = false

[dependencies]
ravenrs-criteria = { workspace = true, features = ["json"] }
ravenrs-report.workspace = true
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
proc-macro2.workspace = true

[lints]
workspace = true
