[package]
name = "ravenrs-app-ui"
description = "Screens for a RavenRS business application: lists, forms, commands and the shell, generated from the application model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-app-ui"
keywords = ["application", "framework", "crud", "gui"]
categories = ["gui"]

[features]
default = ["images"]
# Pictures on forms, which need decoding. Without it, a picture field takes a file like any other.
images = ["ravenrs-widgets/decode"]
# Registers its types with the playground's interpreter.
live = ["dep:ravenrs-live", "ravenrs-widgets/live", "ravenrs-app/live"]

# The modules of this crate use each other in a loop of 17; `module_cycle` holds it there so it
# cannot grow, and asks for a lower number as #294 untangles it. `cargo ravenrs-lint -p ravenrs-app-ui --modules`
# shows who uses whom.
[package.metadata.ravenrs-lint]
max-module-cycle = 17

[dependencies]
ravenrs-live = { workspace = true, optional = true }
ravenrs-app-i18n.workspace = true
ravenrs-app.workspace = true
ravenrs-app-a11y.workspace = true
ravenrs-barcode.workspace = true
ravenrs-core.workspace = true
ravenrs-criteria.workspace = true
ravenrs-grid-export.workspace = true
ravenrs-layout.workspace = true
ravenrs-reactive.workspace = true
ravenrs-report.workspace = true
ravenrs-style.workspace = true
ravenrs-widgets = { workspace = true, features = ["charts"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
