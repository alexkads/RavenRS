[package]
name = "ravenrs-widgets-base"
description = "The base of the RavenRS widgets: the UI runtime, motion, platform services and the basic controls. Applications use it through ravenrs-widgets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-widgets"
keywords = ["gui", "ui", "widgets", "components"]
categories = ["gui"]

[dependencies]
ravenrs-app-i18n.workspace = true
ravenrs-core.workspace = true
ravenrs-animation.workspace = true
ravenrs-reactive.workspace = true
ravenrs-layout.workspace = true
ravenrs-text.workspace = true
ravenrs-live = { workspace = true, optional = true }
ravenrs-style.workspace = true
tracing.workspace = true
serde.workspace = true
image = { workspace = true, optional = true }

[features]
default = ["decode"]
# PNG and JPEG decoding for `Image::from_bytes`.
decode = ["dep:image"]
# The types of the base exposed to the playground's interpreter.
live = ["dep:ravenrs-live", "ravenrs-core/live", "ravenrs-style/live", "ravenrs-layout/live", "ravenrs-text/live"]

[dev-dependencies]
# The examples in the documentation are written as applications write them, through the facade.
# A path with no version: `cargo publish` leaves it out.
ravenrs-widgets = { path = "../ravenrs-widgets" }
proptest.workspace = true

[lints]
workspace = true
