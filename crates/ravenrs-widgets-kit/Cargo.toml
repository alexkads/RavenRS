[package]
name = "ravenrs-widgets-kit"
description = "The RavenRS components of general use: navigation, commands, form editors, lookups, filters, status pieces and tiles. Applications use them through ravenrs-widgets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-widgets"
keywords = ["gui", "ui", "widgets", "components"]
categories = ["gui"]

[dependencies]
ravenrs-widgets-base.workspace = true
ravenrs-app-i18n.workspace = true
ravenrs-core.workspace = true
ravenrs-reactive.workspace = true
ravenrs-layout.workspace = true
ravenrs-text.workspace = true
ravenrs-live = { workspace = true, optional = true }
ravenrs-style.workspace = true
ravenrs-criteria.workspace = true
tracing.workspace = true
serde.workspace = true

[features]
default = ["decode"]
# `ImageField`, which reads the picture it is given.
decode = ["ravenrs-widgets-base/decode"]
# The components exposed to the playground's interpreter.
live = ["dep:ravenrs-live", "ravenrs-widgets-base/live", "ravenrs-core/live", "ravenrs-style/live", "ravenrs-layout/live"]

[dev-dependencies]
# The examples in the documentation are written as applications write them, through the facade.
# A path with no version: `cargo publish` leaves it out.
ravenrs-widgets = { path = "../ravenrs-widgets" }

[lints]
workspace = true
