[package]
name = "ravenrs-flows"
description = "Runs flows drawn on a RavenRS FlowCanvas: a versioned definition, a catalog of node kinds, a checked plan, and runs that pass items from node to node, whole, from a node or one node alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-flows"
keywords = ["workflow", "automation", "flow", "nodes", "dataflow"]
categories = ["gui", "data-structures"]

[dependencies]
ravenrs-graphics.workspace = true
# The conditions and values of the built-in nodes, over each item's JSON.
ravenrs-criteria = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The machine's clock in a browser, where std has none.
js-sys.workspace = true

[lints]
workspace = true

[dev-dependencies]
ravenrs-graphics.workspace = true
serde_json.workspace = true
