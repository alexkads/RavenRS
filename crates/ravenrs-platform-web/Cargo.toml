[package]
name = "ravenrs-platform-web"
description = "RavenRS browser backend: a <canvas> rendered with WebGPU from WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-platform-web"
keywords = ["gui", "wasm", "webgpu", "canvas"]
categories = ["gui", "wasm"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ravenrs-core.workspace = true
ravenrs-style.workspace = true
ravenrs-widgets.workspace = true
ravenrs-render.workspace = true
tracing.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Performance",
    "MediaQueryList",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Navigator",
    "Event",
    "EventTarget",
    "PointerEvent",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "HtmlTextAreaElement",
    "InputEvent",
    "CompositionEvent",
    "FocusEvent",
    "ResizeObserver",
    "CssStyleDeclaration",
    "Node",
    "DomRect",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "console",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
