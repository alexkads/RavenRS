[package]
name = "raven-platform-web"
description = "RavenRS browser backend: a <canvas> rendered with WebGPU from WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
raven-core.workspace = true
raven-style.workspace = true
raven-widgets.workspace = true
raven-render.workspace = true
tracing.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Navigator",
    "Event",
    "EventTarget",
    "PointerEvent",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "FocusEvent",
    "ResizeObserver",
    "CssStyleDeclaration",
    "Node",
    "console",
] }

[lints]
workspace = true
