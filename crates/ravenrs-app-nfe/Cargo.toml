[package]
name = "ravenrs-app-nfe"
description = "BETA, proof of concept: a RavenRS application module that issues NF-e and NFC-e documents, with a sandbox of the SEFAZ. Not homologated, no production."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-app-nfe"
keywords = ["nfe", "nfce", "sefaz", "gui", "brazil"]
categories = ["gui"]

[features]
default = []
# Talking to the real homologation servers, with an A1 certificate. Only on the desktop.
http = ["ravenrs-nfe/http"]

[dependencies]
ravenrs-app.workspace = true
ravenrs-app-report.workspace = true
ravenrs-app-ui.workspace = true
ravenrs-nfe.workspace = true
ravenrs-nfse.workspace = true
ravenrs-reactive.workspace = true
ravenrs-report.workspace = true
ravenrs-report-label.workspace = true
ravenrs-widgets.workspace = true
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde_json.workspace = true

[lints]
workspace = true
