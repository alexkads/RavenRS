[package]
name = "ravenrs-app-server"
description = "Web API for RavenRS applications: protected CRUD, filters, batches and OpenAPI over the model and the permissions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-app-server"
keywords = ["rest", "api", "server", "openapi", "business"]
categories = ["web-programming::http-server"]

[dependencies]
ravenrs-app.workspace = true
ravenrs-criteria.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2 = "0.10"
tokio = { version = "1.54", default-features = false, features = ["net", "rt-multi-thread", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[dev-dependencies]
ureq = { version = "3.5", default-features = false }
tokio = { version = "1.54", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
