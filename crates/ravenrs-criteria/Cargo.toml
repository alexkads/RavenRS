[package]
name = "ravenrs-criteria"
description = "A criteria and expression language: parse, print, evaluate over any rows, validate, and translate to parameterized SQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-criteria"
keywords = ["expression", "criteria", "filter", "sql", "parser"]
categories = ["parser-implementations", "database"]

[features]
default = ["json"]
# Evaluates over serde_json values.
json = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
