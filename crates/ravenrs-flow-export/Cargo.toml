[package]
name = "ravenrs-flow-export"
description = "Saves a RavenRS FlowCanvas diagram as a PNG picture, an SVG drawing or a PDF page."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-flow-export"
keywords = ["diagram", "export", "png", "svg", "pdf"]
