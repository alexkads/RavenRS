[package]
name = "ravenrs-report-server"
description = "Report server for RavenRS Reporting: stores layouts, renders over HTTP and delivers scheduled reports as PDF, XLSX or CSV."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-report-server"
keywords = ["report", "server", "schedule", "pdf", "xlsx"]
categories = ["web-programming::http-server", "template-engine"]

[dependencies]
ravenrs-report.workspace = true
ravenrs-report-export.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1.54", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "webpki-roots"] }
jiff = { version = "0.2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
