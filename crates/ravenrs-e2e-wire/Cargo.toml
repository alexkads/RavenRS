[package]
name = "ravenrs-e2e-wire"
description = "The test channel of RavenRS apps: a tool such as Raven Test Studio opens the app in a child process with no window and drives it, one JSON line per step, with ravenrs-e2e on the other side."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ravenrs-e2e-wire"
keywords = ["gui", "testing", "e2e", "ipc"]
categories = ["gui", "development-tools::testing"]

[features]
# On by default: every RavenRS app carries its test channel, closed until it is opened with
# --e2e-serve. A tool that only drives apps can turn it off.
default = ["serve"]
e2e-source = ["ravenrs-e2e/e2e-source"]
# The app's side: answers a tool over stdin and stdout.
serve = []

[dependencies]
ravenrs-core.workspace = true
ravenrs-e2e.workspace = true
ravenrs-widgets-base.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ravenrs-reactive.workspace = true
ravenrs-style.workspace = true
ravenrs-widgets.workspace = true

[lints]
workspace = true
