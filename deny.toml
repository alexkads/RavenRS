# cargo-deny: license, advisory, ban and source policy for RavenRS.
# Run with `cargo deny check` (part of scripts/check.sh when cargo-deny is installed).

[graph]
all-features = true

[advisories]
# Known vulnerabilities fail the check; unmaintained crates are reported.
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses compatible with distributing RavenRS under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Several versions of the same crate are common in the wgpu/winit stack; report, do not fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
