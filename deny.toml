# cargo-deny: license, advisory, ban and source policy for RavenRS.
# Run with `cargo deny check` (part of scripts/check.sh when cargo-deny is installed).

[graph]
all-features = true

[advisories]
# Known vulnerabilities fail the check; unmaintained crates are reported.
version = 2
yanked = "deny"
# Linux screen reader support (AccessKit -> atspi -> zbus 5) pulls in three crates
# that were merged into zbus 6. They are unmaintained, not vulnerable; remove
# these once atspi moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; reached only through AccessKit's Linux adapter" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; reached only through AccessKit's Linux adapter" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; reached only through AccessKit's Linux adapter" },
    { id = "RUSTSEC-2024-0436", reason = "paste is finished, not vulnerable; reached only through candle in ravenrs-ai, and no replacement exists" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, not vulnerable; reached only through lopdf in pdf-extract, which reads receipts in family-finance's Telegram bot" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained, not vulnerable; reached only through krilla's simple-text in ravenrs-deck, which shapes the notes and handout text of a PDF export" },
    { id = "RUSTSEC-2023-0071", reason = "rsa has no fixed release; ravenrs-nfe (beta POC) only signs locally and decrypts nothing, so no attacker times the key over a network. Revisit before any server-side signing." },
]

[licenses]
version = 2
# Permissive licenses compatible with distributing RavenRS under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Unlicense",
    "0BSD",
    # The root certificate list the report server uses for TLS (webpki-roots).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# The presentation engine's last-resort text face (Ubuntu Light, in epaint_default_fonts): the
# Ubuntu Font Licence lets the font be embedded and redistributed with software.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[bans]
# Several versions of the same crate are common in the wgpu/winit stack; report, do not fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
