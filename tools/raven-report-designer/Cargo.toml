[package]
name = "raven-report-designer"
description = "RavenRS Report Designer: an end-user report designer for the desktop and the browser."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# How Raven Test Studio (RTS) finds and opens this tool on the test channel (--e2e-serve).
[package.metadata.ravenrs.e2e]
app = "Raven Report Designer"
binary = "raven-report-designer"

[dependencies]
ravenrs-app-update.workspace = true
ravenrs = { workspace = true, features = ["tray"] }
ravenrs-report-designer.workspace = true
# The report a file holds, which the designer opens and saves back to it.
ravenrs-report.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The test channel, closed until the tool is opened with --e2e-serve.
ravenrs-e2e.workspace = true
ravenrs-e2e-wire = { workspace = true, features = ["serve"] }
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console", "Window", "Document", "Element", "HtmlElement", "Node", "CssStyleDeclaration", "FontFaceSet", "Location"] }

[dev-dependencies]
image.workspace = true
pollster.workspace = true

[lints]
workspace = true
