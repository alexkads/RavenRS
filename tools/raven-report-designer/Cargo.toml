[package]
name = "raven-report-designer"
description = "RavenRS Report Designer: an end-user report designer for the desktop and the browser."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ravenrs-app-update.workspace = true
ravenrs = { workspace = true, features = ["tray"] }
ravenrs-report-designer.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console", "Window", "Document", "Element", "HtmlElement", "Node", "CssStyleDeclaration", "FontFaceSet", "Location"] }

[lints]
workspace = true
