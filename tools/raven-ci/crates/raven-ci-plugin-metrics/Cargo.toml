[package]
name = "raven-ci-plugin-metrics"
description = "The plugin metrics of Raven CI: /metrics in the Prometheus format, with the queue, the builds, the agents, the plugins and the memory, from the picture the core gives."
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
publish = false

[dependencies]
raven-ci-plugin-api = { path = "../raven-ci-plugin-api" }
ravenrs-app.workspace = true
# The Prometheus text format of the house.
ravenrs-metrics.workspace = true
serde_json.workspace = true

[dev-dependencies]
raven-ci-plugin-api = { path = "../raven-ci-plugin-api", features = ["testing"] }
raven-ci-core = { path = "../raven-ci-core" }
raven-ci-plugin-format-toml = { path = "../raven-ci-plugin-format-toml" }
raven-ci-plugin-shell = { path = "../raven-ci-plugin-shell" }

[lints]
workspace = true
