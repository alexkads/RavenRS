[package]
name = "raven-ci-plugin-format-toml"
description = "The plugin format-toml of Raven CI: reads .raven-ci.toml (stages, steps, parameters, when, post, timeouts, retries, locks, containers, artifacts and test results) into a flow, saying every error with its line."
version = "0.1.0"
edition.workspace = true
# raven-ci-core, which the tests use, needs 1.89 (ravenrs-flows-runtime, rusqlite 0.41).
rust-version = "1.89"
license.workspace = true
publish = false

[dependencies]
raven-ci-plugin-api = { path = "../raven-ci-plugin-api" }
ravenrs-app.workspace = true
ravenrs-flows.workspace = true
serde_json.workspace = true
# Reads the file keeping where each value is, to say the line of each error.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
raven-ci-core = { path = "../raven-ci-core" }
raven-ci-plugin-shell = { path = "../raven-ci-plugin-shell" }

[lints]
workspace = true
