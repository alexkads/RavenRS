[package]
name = "raven-ci-plugin-email"
description = "The plugin email of Raven CI: a message when a build fails, when it passes again or always, sent through ravenrs-mail with the credential of the vault."
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
publish = false

[dependencies]
raven-ci-plugin-api = { path = "../raven-ci-plugin-api" }
ravenrs-app.workspace = true
# The sending of email of the house, shared with the report server.
ravenrs-mail.workspace = true
serde_json.workspace = true

[dev-dependencies]
raven-ci-core = { path = "../raven-ci-core" }
raven-ci-plugin-format-toml = { path = "../raven-ci-plugin-format-toml" }
raven-ci-plugin-shell = { path = "../raven-ci-plugin-shell" }

[lints]
workspace = true
