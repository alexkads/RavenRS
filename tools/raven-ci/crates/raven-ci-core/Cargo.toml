[package]
name = "raven-ci-core"
description = "The core of Raven CI: the register of plugins (compiled in and external over JSON-RPC), the model of jobs and builds, and the queue, over ravenrs-flows-runtime."
version = "0.1.0"
edition.workspace = true
# ravenrs-flows-runtime (rusqlite 0.41) needs 1.89, one above the workspace.
rust-version = "1.89"
license.workspace = true
publish = false

[dependencies]
raven-ci-plugin-api = { path = "../raven-ci-plugin-api" }
ravenrs-app.workspace = true
# The HTTP API: signing in, keys, and the routes of the plugins through its fallback.
ravenrs-app-server.workspace = true
# People and roles, in a file each thread of the server opens.
ravenrs-app-sqlite.workspace = true
ravenrs-flows.workspace = true
ravenrs-flows-runtime.workspace = true
ravenrs-metrics.workspace = true
ravenrs-process.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Reads the plugin.toml of an external plugin.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
raven-ci-plugin-api = { path = "../raven-ci-plugin-api", features = ["testing"] }

[lints]
workspace = true
