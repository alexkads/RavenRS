[package]
name = "raven-ci-plugin-agent-local"
description = "The plugin agent-local of Raven CI: brings a build agent up on the server's machine, as another user when the template says one."
version = "0.1.0"
edition.workspace = true
# raven-ci-core needs 1.89 (ravenrs-flows-runtime, rusqlite 0.41).
rust-version = "1.89"
license.workspace = true
publish = false

[dependencies]
raven-ci-core = { path = "../raven-ci-core" }
raven-ci-plugin-api = { path = "../raven-ci-plugin-api" }
ravenrs-app.workspace = true
ravenrs-process.workspace = true
serde_json.workspace = true

[lints]
workspace = true
