[package]
name = "raven-ci-plugin-webhook-out"
description = "The plugin webhook-out of Raven CI: the end of a build posted as JSON to an address, signed with HMAC-SHA256 and tried again with waits."
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
publish = false

[dependencies]
raven-ci-plugin-api = { path = "../raven-ci-plugin-api" }
ravenrs-app.workspace = true
# The HMAC-SHA256 of the webhooks of the house, the same the receiving side checks.
ravenrs-app-server.workspace = true
serde_json.workspace = true
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
raven-ci-core = { path = "../raven-ci-core" }
raven-ci-plugin-format-toml = { path = "../raven-ci-plugin-format-toml" }
raven-ci-plugin-shell = { path = "../raven-ci-plugin-shell" }

[lints]
workspace = true
