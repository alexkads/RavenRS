[package]
name = "raven-ci"
description = "Raven CI: a small CI/CD server whose every function is a plugin, with the queue, the model of builds and the register of plugins in its core."
version = "0.1.9"
edition.workspace = true
# ravenrs-flows-runtime (rusqlite 0.41) needs 1.89, one above the workspace.
rust-version = "1.89"
license.workspace = true
publish = false

[dependencies]
raven-ci-core = { path = "crates/raven-ci-core" }
# The fake plugins: the self-test plugs one of each extension point in.
raven-ci-plugin-api = { path = "crates/raven-ci-plugin-api", features = ["testing"] }
raven-ci-plugin-api-trigger = { path = "crates/raven-ci-plugin-api-trigger" }
raven-ci-plugin-agent-local = { path = "crates/raven-ci-plugin-agent-local" }
raven-ci-plugin-agent-remote = { path = "crates/raven-ci-plugin-agent-remote" }
raven-ci-plugin-artifacts = { path = "crates/raven-ci-plugin-artifacts" }
raven-ci-plugin-azure-devops = { path = "crates/raven-ci-plugin-azure-devops" }
raven-ci-plugin-cargo = { path = "crates/raven-ci-plugin-cargo" }
raven-ci-plugin-cron = { path = "crates/raven-ci-plugin-cron" }
raven-ci-plugin-credentials = { path = "crates/raven-ci-plugin-credentials" }
raven-ci-plugin-docker = { path = "crates/raven-ci-plugin-docker" }
raven-ci-plugin-email = { path = "crates/raven-ci-plugin-email" }
raven-ci-plugin-explain = { path = "crates/raven-ci-plugin-explain" }
raven-ci-plugin-format-jenkinsfile = { path = "crates/raven-ci-plugin-format-jenkinsfile" }
raven-ci-plugin-format-toml = { path = "crates/raven-ci-plugin-format-toml" }
raven-ci-plugin-git = { path = "crates/raven-ci-plugin-git" }
raven-ci-plugin-github = { path = "crates/raven-ci-plugin-github" }
raven-ci-plugin-junit = { path = "crates/raven-ci-plugin-junit" }
raven-ci-plugin-kubernetes = { path = "crates/raven-ci-plugin-kubernetes" }
raven-ci-plugin-lock = { path = "crates/raven-ci-plugin-lock" }
raven-ci-plugin-metrics = { path = "crates/raven-ci-plugin-metrics" }
raven-ci-plugin-shell = { path = "crates/raven-ci-plugin-shell" }
raven-ci-plugin-workspace = { path = "crates/raven-ci-plugin-workspace" }
raven-ci-plugin-webhook-github = { path = "crates/raven-ci-plugin-webhook-github" }
raven-ci-plugin-webhook-out = { path = "crates/raven-ci-plugin-webhook-out" }
ravenrs-app-server.workspace = true
ravenrs-app-update.workspace = true
# plugins compilar: runs cargo and the plugin it built.
ravenrs-process.workspace = true
# plugins compilar: reads the Cargo.toml of the plugin and the plugin.toml it writes.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# The runtime of the HTTP server, small: two threads.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros"] }
serde.workspace = true
serde_json.workspace = true
# The commands that speak to a server (src/remote.rs).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# raven-ci mcp: the MCP server for sessions of AI (src/mcp.rs, #941), as ravenrs-mcp is made.
rmcp.workspace = true

[dev-dependencies]
ravenrs-process.workspace = true
ureq = { version = "3.5", default-features = false }

[lints]
workspace = true

# >>> camadas.py: gerado do Cargo.toml da raiz por `python3 scripts/camadas.py deps --write`; não edite à mão
[workspace]
resolver = "3"
members = ["crates/raven-ci-agent", "crates/raven-ci-core", "crates/raven-ci-explicador", "crates/raven-ci-painel", "crates/raven-ci-plugin-agent-local", "crates/raven-ci-plugin-agent-remote", "crates/raven-ci-plugin-api", "crates/raven-ci-plugin-api-trigger", "crates/raven-ci-plugin-artifacts", "crates/raven-ci-plugin-azure-devops", "crates/raven-ci-plugin-cargo", "crates/raven-ci-plugin-credentials", "crates/raven-ci-plugin-cron", "crates/raven-ci-plugin-docker", "crates/raven-ci-plugin-email", "crates/raven-ci-plugin-explain", "crates/raven-ci-plugin-format-jenkinsfile", "crates/raven-ci-plugin-format-toml", "crates/raven-ci-plugin-git", "crates/raven-ci-plugin-github", "crates/raven-ci-plugin-junit", "crates/raven-ci-plugin-kubernetes", "crates/raven-ci-plugin-lock", "crates/raven-ci-plugin-metrics", "crates/raven-ci-plugin-shell", "crates/raven-ci-plugin-webhook-github", "crates/raven-ci-plugin-webhook-out", "crates/raven-ci-plugin-workspace", "plugins/exemplo-rust"]

