# Drop-in of the service raven-ci for agents of another user (agent-local with `usuario`).
# Install it with:
#   sudo mkdir -p /etc/systemd/system/raven-ci.service.d
#   sudo cp /usr/share/raven-ci/agentes-de-outro-usuario.conf /etc/systemd/system/raven-ci.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart raven-ci
#
# - NoNewPrivileges=false: sudo switches the user only without it.
# - PrivateTmp=false: an agent started by the server runs in the server's mount namespace, so with
#   a private /tmp its builds see the server's /tmp, not the machine's. A tool the machine shares
#   between its users (the server of sccache, a socket in /tmp) then breaks for everyone once the
#   service restarts and takes that /tmp away (#931). With it off, a build sees the /tmp of the
#   machine, as on a node of Jenkins.
[Service]
NoNewPrivileges=false
PrivateTmp=false
