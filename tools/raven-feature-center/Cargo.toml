wgpu = "30.0.1"
# Without "wayland-csd-adwaita": its font stack (ttf-parser) is unmaintained (RUSTSEC-2026-0192);
# Wayland windows use winit's built-in fallback frame instead.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
accesskit = "0.25.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
accesskit_winit = { version = "0.34.2", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
parley = { version = "0.12.0", default-features = false, features = ["std"] }
swash = "0.2.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned exactly: the `wasm-bindgen` CLI used to post-process the .wasm must match.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.80"
web-sys = "0.3.107"
console_error_panic_hook = "0.1.7"
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Only for the ravenrs-mcp tool; nothing in the framework depends on these.
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54", default-features = false, features = ["macros", "rt"] }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
regex-lite = "0.1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
uuid = { version = "1", default-features = false, features = ["v4", "js"] }
rusqlite = { version = "0.41", features = ["bundled"] }
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Each workspace apart carries the whole list of the root's dependencies (camadas.toml, #1080) and
# uses part of it: without this, Cargo warns about every entry the workspace does not use.

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

[profile.dev]
# Each worktree has its own target/; keep backtraces with file and line, drop the rest.
debug = "line-tables-only"

# Third-party crates built with some optimisation: the tests drive the UI, SQLite (its C is compiled
# with this level too), text shaping and images, which are many times slower at opt-level 0. The
# workspace's own crates stay unoptimised, so they still build fast and debug as written.

[profile.dev.package."*"]
opt-level = 1
# No debug information for them: less to compile and link, as Cargo's build performance guide
# recommends. Backtraces still name the workspace's own lines.
debug = false

# The spreadsheet evaluator budgets its stack for recursive LAMBDA calls; unoptimised frames are
# several times larger, so the same formula would stop much earlier in debug builds.

[profile.dev.package.ravenrs-sheet]
opt-level = 1

# The PDF engine's tests recurse as deep as hostile files do and decrypt with every key length; at
# opt-level 0 they overflow the stack or take minutes, so it builds as PdfCraft builds it.

[profile.dev.package.ravenrs-pdf]
opt-level = 1

# The presentation engine is built as DeckCraft builds it: its tests nest groups as deep as a
# saved file may, which overflows the stack in unoptimised frames, and decode video frames.

[profile.dev.package.ravenrs-deck]
opt-level = 1

[profile.release]
# Smaller WASM binaries; native release builds benefit as well.
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"

