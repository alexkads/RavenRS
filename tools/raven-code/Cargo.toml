[package]
name = "raven-code"
description = "Raven Code: a small editor for Rust projects built on the DockArea. It opens a project from disk, edits and saves its files, and builds and runs it with cargo, with the compiler's errors marked in the code."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# How Raven Test Studio (RTS) finds and opens this tool on the test channel (--e2e-serve).
[package.metadata.ravenrs.e2e]
app = "Raven Code"
binary = "raven-code"

[dependencies]
ravenrs-app-update.workspace = true
ravenrs = { workspace = true, features = ["code", "tray"] }
serde_json.workspace = true
# Cargo and the program it runs, stopped with what they start.
ravenrs-process.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The test channel, closed until the tool is opened with --e2e-serve.
ravenrs-e2e.workspace = true
ravenrs-e2e-wire = { workspace = true, features = ["serve"] }
tracing-subscriber.workspace = true

[dev-dependencies]
image.workspace = true
pollster.workspace = true

[lints]
workspace = true
