[package]
name = "report-designer"
description = "RavenRS Report Designer: an end-user report designer for the desktop and the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ravenrs.workspace = true
ravenrs-report.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console", "Window", "Performance", "Document", "Element", "HtmlElement", "HtmlIFrameElement", "Node", "CssStyleDeclaration", "FontFaceSet"] }

[lints]
workspace = true
