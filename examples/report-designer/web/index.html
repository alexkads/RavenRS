<!doctype html>
<html lang="pt-BR">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RavenRS Report Designer</title>
    <meta name="description" content="Editor de relatórios RavenRS no navegador: modelos, assistente, arrastar e soltar e pré-visualização instantânea." />

    </style>

  <body>
    <canvas id="raven-canvas" aria-label="RavenRS Report Designer"></canvas>
    <script type="module">
      import init from "./pkg/report_designer.js";
      init();
    </script>
