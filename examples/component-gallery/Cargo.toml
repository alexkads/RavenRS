[package]
name = "component-gallery"
description = "Every RavenRS component, running natively and in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["entry"]
# Its own page in the browser. The feature center uses the examples as a library, with its own page,
# so it leaves this off (#587).
entry = []

# How Raven Test Studio (RTS) finds and opens this app on the test channel (--e2e-serve).
[package.metadata.ravenrs.e2e]
app = "Componentes"
binary = "component-gallery"

[dependencies]
ravenrs = { workspace = true, features = ["code", "live"] }
ravenrs-grid-export.workspace = true
ravenrs-app = { workspace = true, features = ["live"] }
ravenrs-app-ui = { workspace = true, features = ["live"] }
ravenrs-project.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The test channel, closed until the app is opened with --e2e-serve.
ravenrs-e2e.workspace = true
ravenrs-e2e-wire = { workspace = true, features = ["serve"] }
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console", "Window", "Location", "UrlSearchParams"] }

[dev-dependencies]
image.workspace = true
pollster.workspace = true

# The house follows its own rules: `cargo run -p ravenrs-lint -- -p component-gallery` (scripts/check.sh runs it).
[package.metadata.ravenrs-lint]
language = "en"

[lints]
workspace = true
