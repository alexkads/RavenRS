[package]
name = "component-gallery"
description = "Every RavenRS component, running natively and in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ravenrs = { workspace = true, features = ["code", "live"] }
ravenrs-grid-export.workspace = true
ravenrs-app = { workspace = true, features = ["live"] }
ravenrs-app-ui = { workspace = true, features = ["live"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console", "Window", "Location", "UrlSearchParams"] }

[dev-dependencies]
image.workspace = true
pollster.workspace = true

[lints]
workspace = true
