[package]
name = "feature-center"
description = "Every feature of the application framework, one small demonstration each, to try and to test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# What goes in the build (#587). The center needs all three; the site's pages of components and its
# playground are built with `--no-default-features --features widgets` or `widgets,playground`.
[features]
default = ["app", "widgets", "playground"]
# The center: the application framework, its storage (SQLite on the desktop) and its web API.
app = [
    "widgets",
    "dep:ravenrs-app",
    "dep:ravenrs-app-library",
    "dep:ravenrs-app-remote",
    "dep:ravenrs-app-report",
    "dep:ravenrs-app-ui",
    "dep:ravenrs-report",
    "dep:rust_decimal",
    "dep:ravenrs-app-server",
    "dep:tokio",
    "dep:ravenrs-app-sqlite",
    "dep:rusqlite",
]
# The pages of the components, every feature of each.
widgets = []
# The examples to edit and run, from the component gallery until #579 brings them here.
playground = ["dep:component-gallery"]

[dependencies]
serde_json.workspace = true
ravenrs.workspace = true
ravenrs-app-update = { workspace = true, features = ["ui"] }
ravenrs-widgets.workspace = true
ravenrs-app = { workspace = true, optional = true }
ravenrs-app-library = { workspace = true, optional = true }
ravenrs-app-remote = { workspace = true, optional = true }
ravenrs-app-report = { workspace = true, optional = true }
ravenrs-app-ui = { workspace = true, optional = true }
# The texts of the widgets in the mode `componentes`, in the language of `idioma`.
ravenrs-app-i18n.workspace = true
# The expressions of the Editor de expressões page, worked out for its preview.
ravenrs-criteria = { workspace = true, features = ["json"] }
ravenrs-report = { workspace = true, optional = true }
rust_decimal = { version = "1", default-features = false, features = ["std"], optional = true }
component-gallery = { path = "../component-gallery", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ravenrs-app-server = { workspace = true, optional = true }
tokio = { version = "1.54", default-features = false, features = ["net", "rt-multi-thread"], optional = true }
ravenrs-app-sqlite = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console", "Window", "Location", "UrlSearchParams"] }

[dev-dependencies]
ravenrs-app-a11y.workspace = true
image.workspace = true
pollster.workspace = true
ravenrs-core.workspace = true
ravenrs-render.workspace = true
serde_json.workspace = true
ravenrs-report-label.workspace = true
ravenrs-style.workspace = true
ravenrs-widgets.workspace = true

[[bin]]
name = "api"
required-features = ["app"]

[[test]]
name = "tour"
required-features = ["app"]

[[test]]
name = "accessibility"
required-features = ["app"]

[[test]]
name = "opening"
required-features = ["app", "widgets", "playground"]

[[test]]
name = "cabos"
required-features = ["widgets"]

[lints]
workspace = true
