[package]
name = "grid-poc"
description = "A proof of concept of the RavenRS data grid: group by dragging, scenarios, pages and rows on a server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# How Raven Test Studio (RTS) finds and opens this app on the test channel (--e2e-serve).
[package.metadata.ravenrs.e2e]
app = "Grade de dados"
binary = "grid-poc"

[dependencies]
ravenrs-e2e.workspace = true
ravenrs-e2e-wire = { workspace = true, features = ["serve"] }
ravenrs.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
