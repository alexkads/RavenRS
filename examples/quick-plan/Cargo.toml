[package]
name = "quick-plan"
description = "One list shown as a grid, a chart, a month, a timeline and a tree, changed only by the model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ravenrs.workspace = true
ravenrs-app.workspace = true
ravenrs-app-report.workspace = true
ravenrs-app-ui.workspace = true
ravenrs-criteria.workspace = true
ravenrs-widgets.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console"] }

[dev-dependencies]
ravenrs-app-a11y.workspace = true
ravenrs-core.workspace = true
ravenrs-style.workspace = true

[lints]
workspace = true
