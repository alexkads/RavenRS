[package]
name = "quick-plan"
description = "One list shown as a grid, a chart, a month, a timeline and a tree, changed only by the model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# How Raven Test Studio (RTS) finds and opens this app on the test channel (--e2e-serve).
[package.metadata.ravenrs.e2e]
app = "Raven Plano"
binary = "quick-plan"

[dependencies]
ravenrs.workspace = true
ravenrs-app.workspace = true
ravenrs-app-report.workspace = true
ravenrs-app-ui.workspace = true
ravenrs-criteria.workspace = true
ravenrs-widgets.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The test channel, closed until the app is opened with --e2e-serve.
ravenrs-e2e.workspace = true
ravenrs-e2e-wire = { workspace = true, features = ["serve"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console"] }

[dev-dependencies]
ravenrs-app-a11y.workspace = true
ravenrs-core.workspace = true
ravenrs-style.workspace = true

[lints]
workspace = true
