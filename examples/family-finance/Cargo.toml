[package]
name = "family-finance"
description = "RavenRS example: a desktop app for family expenses and bills to pay, stored in SQLite."
# The app has its own version: raising it is what announces an update (see README.md).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ravenrs.workspace = true
ravenrs-criteria.workspace = true
ravenrs-report.workspace = true
ravenrs-report-export.workspace = true
ravenrs-report-viewer.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jiff = "0.2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# "bundled" compiles SQLite into the app, so nobody has to install it.
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
image.workspace = true
pollster.workspace = true

[lints]
workspace = true
