[package]
name = "family-finance"
description = "RavenRS example: a desktop app for family expenses and bills to pay, stored in SQLite."
# The app has its own version: raising it is what announces an update (see README.md).
version = "0.1.35"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ravenrs = { workspace = true, features = ["tray", "notifications"] }
ravenrs-ai.workspace = true
ravenrs-criteria.workspace = true
ravenrs-report.workspace = true
ravenrs-report-export.workspace = true
ravenrs-report-viewer.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jiff = "0.2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# Reads the text of a receipt in Rust, on every system.
pdf-extract = "0.12"
# Telegram's voice notes: Opus in Ogg, decoded in Rust on every system.
ogg = "0.9"
opus-decoder = "0.1"
uuid.workspace = true
# "bundled" compiles SQLite into the app, so nobody has to install it.
rusqlite.workspace = true
ravenrs-app.workspace = true
ravenrs-app-ui.workspace = true
ravenrs-app-sqlite.workspace = true

[dev-dependencies]
image.workspace = true
pollster.workspace = true

[lints]
workspace = true
