[package]
name = "spreadsheet"
description = "The RavenRS spreadsheet: a household budget with formulas, open and save as XLSX, in a native window and in the browser."
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# How Raven Test Studio (RTS) finds and opens this app on the test channel (--e2e-serve).
[package.metadata.ravenrs.e2e]
app = "Planilha"
binary = "spreadsheet"

[dependencies]
ravenrs.workspace = true
ravenrs-spreadsheet.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The test channel, closed until the app is opened with --e2e-serve.
ravenrs-e2e.workspace = true
ravenrs-e2e-wire = { workspace = true, features = ["serve"] }
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["console"] }

[lints]
workspace = true
